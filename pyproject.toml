[project]
name = "ispeccion-video"
version = "0.1.0"
description = "Analizador pericial y objetivo de video y audio con IA local (Faster-Whisper CUDA + Ollama Qwen2.5-VL)"
authors = [
    { name = "markorn", email = "markorn2002@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
